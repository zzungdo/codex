<title id="title">오인식 감소와 실제 객체 손실은 별도로 판단</title>
<desc id="desc">같은 가상 장면의 기준 모델과 후보 모델을 비교합니다. 신규 차량 검출이 놓친 보행자를 해결하지 않습니다. 원리 설명용 가상 예시 · 실제 데이터 및 성과 수치 아님</desc>
