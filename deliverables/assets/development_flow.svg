<text x="838" y="1008" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#172B3A">저장된 결과를 평가하는 경로</text>
<text x="1220" y="534.75" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#17658A">별도 측방 모델</text>
