<text x="200.0" y="224.75" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#17658A">데이터·전처리</text>
<rect x="390" y="166" width="300" height="100" rx="14" fill="white" stroke="#17658A" stroke-width="3"/>
<text x="540.0" y="224.75" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#17658A">학습·조건 비교</text>
