<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">전체 개발 흐름과 모델별 평가 범위</title>
<desc id="desc">ONNX 평가, SDK 시뮬레이션, 저장된 보드 결과 평가와 별도 측방 모델의 직접 실물 보드 시험을 구분합니다. 수행 업무를 일반화한 개념도 · 모델별 검증 범위는 본문 참조</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#5A6872"/></marker><marker id="redarrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#AD3434"/></marker></defs>
<rect width="1440" height="1040" fill="white"/>
<text x="44" y="59" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="38" font-weight="700" text-anchor="start" fill="#172B3A">전체 개발 흐름과 모델별 평가 범위</text>
<text x="44" y="103" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#5A6872">수행 업무를 일반화한 개념도 · 모델별 검증 범위는 본문 참조</text>
