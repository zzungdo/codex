<text x="119" y="1008" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#172B3A">일반 흐름</text>
<path d="M320,1000 H375" fill="none" stroke="#17658A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7"/>
<text x="389" y="1008" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#172B3A">별도 측방 모델 시험</text>
