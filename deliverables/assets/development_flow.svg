<path d="M720,764 V814" fill="none" stroke="#5A6872" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="400" y="816" width="640" height="90" rx="14" fill="#F3F7FA" stroke="#17658A" stroke-width="3"/>
<text x="720.0" y="869.75" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#17658A">후보 선정·릴리스 판단 자료</text>
<text x="720" y="953" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#5A6872">모든 모델의 직접 보드 시험·제품 출하 완료를 뜻하지 않음</text>
